# 意図モデル(10-intent-recovery)のスキーマ
#
# 出力フォーマットの定義元は qa-intent-recovery/SKILL.md、ID体系は
# conventions.md §6-1。**このスキルセットのID体系の源**であり、
# シナリオ・観点・ケースはここのIDを traces_to で指す。
#
# 台帳は3つだけ。「他の成果物がIDを参照するか、機械チェックが列に依存する
# ものだけ台帳にする」という基準による(conventions.md §6-2)。落としたもの:
#
#   状態(旧 STT)   遷移の from_state / to_state から導出できる。「その状態で
#                    できること」= 出ていく遷移の操作、「終端」= 出ていく遷移が
#                    ないこと。遷移カバレッジが状態カバレッジを含むので、
#                    両方測る意味がない。終端状態だけ notes.md に1行書く
#   引き継ぎ(旧 HO) 引き継ぎとは「その遷移のあと別のActorが拾う」ことなので、
#                    遷移の列にした(next_actor 以下)。人が読む節は
#                    `filter: has:next_actor` のビューとして今までどおり出る
#   ストーリー(旧 US)業務ゴールに統合した。設計原則6「ストーリーは正本ではなく
#                    モデルのビュー」に従えば独立したIDを持つ理由がない
#   後続影響・確認事項 IDがなく機械チェックもないので notes.md の表にした

artifact: intent-recovery
number: "10"
title: 意図モデル
mode_note: |
  ⚠️ 状態遷移の網羅を主張しない。資料に無い遷移は「未観測」であり「存在しない」ではない。

ledgers:
  - key: actors
    id_prefix: ACT
    fields:
      - name: id
        label: ID
        required: yes
        pattern: '^ACT-\d+$'
      - name: actor
        label: Actor
        required: yes
      - name: kind
        label: 種別
        required: yes
        enum: [人, バッチ, 外部システム]
      - name: can_do
        label: 権限・できる操作
        type: list
        required: yes
      - name: sources
        label: 出典
        type: list
      - name: derivation
        label: derivation
        enum: [explicit, inferred, proposed]
        default: explicit
      - name: evidence_level
        enum: [confirmed, likely, hypothesis]
        render: no

  # 状態遷移。状態と引き継ぎはこの台帳から導出・派生する
  - key: transitions
    id_prefix: TRN
    fields:
      - name: id
        label: ID
        required: yes
        pattern: '^TRN-\d+$'
      - name: object
        label: オブジェクト
        required: yes
      - name: from_state
        label: 起点の状態
        required: yes
      - name: operation
        label: 操作
        required: yes
      - name: to_state
        label: 終点の状態
        required: yes
      - name: actor
        label: Actor(ACT)
        required: yes
      # trigger / guard は必須。**厳密な仕様が分からなくても書けるように、
      # `不明` と AMB-ID を許容値に入れている**。空欄だと「条件なし」なのか
      # 「調べていない」のか区別できず、穴が後段に流れない
      - name: trigger
        label: トリガー
        required: yes
      - name: guard
        label: ガード条件
        required: yes
      # --- ここから下が引き継ぎ(旧 HO)。next_actor が埋まっている行が引き継ぎ ---
      - name: next_actor
        label: 引き継ぎ先(ACT)
        render: no
      - name: notice_by
        label: 気づく手段
        render: no
      - name: fails_when
        label: 失敗する条件
        render: no
      - name: deadline
        label: 期限・タイムアウト
        render: no
      - name: sources
        label: 出典
        type: list
      - name: derivation
        label: derivation
        enum: [explicit, inferred, proposed]
        default: explicit
      - name: evidence_level
        enum: [confirmed, likely, hypothesis]
        render: no

  # 業務ゴール。ユーザーストーリーは同じ行のビュー(story / value 列)
  - key: goals
    id_prefix: BG
    fields:
      - name: id
        label: ID
        required: yes
        pattern: '^BG-\d+$'
      - name: actor
        label: Actor(ACT)
        required: yes
      - name: goal
        label: 業務ゴール
        required: yes
      - name: traces_to
        label: 関係する遷移(TRN)
        type: list
        required: yes
      - name: story
        label: ストーリー
        required: yes
        render: no
      # 根拠のない Value を書かない。書けないときは「不明(要確認)」と書く
      - name: value
        label: Value
        required: yes
        render: no
      - name: sources
        label: 出典
        type: list
      - name: evidence_level
        label: evidence_level
        enum: [confirmed, likely, hypothesis]
      - name: derivation
        label: derivation
        enum: [explicit, inferred, proposed]
        default: explicit

rules:
  - unique_ids
  - id_pattern
  - required_fields
  - enum_values
  - explicit_requires_sources

sections:
  - num: 1
    title: Actor 一覧
    from: ledger.actors
  - num: 2
    title: ドメインオブジェクトと状態
    from: narrative.states
  - num: 3
    title: 状態遷移
    intro: narrative.transition_diagram
    from: ledger.transitions
  - num: 4
    title: 業務ゴール
    from: ledger.goals
    columns: [id, actor, goal, traces_to, sources, evidence_level, derivation]
  # 同じ遷移台帳を「引き継ぎ」の切り口で見せる
  - num: 5
    title: ロール間の引き継ぎ(handoff)
    from: ledger.transitions
    filter: has:next_actor
    columns: [id, actor, next_actor, notice_by, fails_when, deadline, derivation]
  - num: 6
    title: 後続影響(downstream_impacts)
    from: narrative.impacts
  # 同じ業務ゴール台帳を「ストーリー」の切り口で見せる
  - num: 7
    title: ユーザーストーリー
    from: ledger.goals
    columns: [id, actor, story, value, traces_to, sources, derivation]
  - num: 8
    title: 確認が必要な事項(暗黙知の欠落)
    from: narrative.questions
  - num: 9
    title: 不足情報
    from: narrative.missing
