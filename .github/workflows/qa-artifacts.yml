# QA成果物の検証(hooks が無い環境の最後の砦)
#
# 4層の防御(_shared/scripts/README.md)のうち第4層。
#   1. SKILL.md の手順  2. gate_check.py  3. hooks  4. CI ← これ
#
# 2つのジョブを持つ:
#   - verifier-selftest : 検証層そのものが壊れていないかを確かめる。
#                         **gate_check が誤って PASS を返すようになると全ゲートが
#                         黙って無効になる**ため、種を仕込んだフィクスチャで
#                         「検出できること」と「解消したら通ること」の両方を見る。
#   - qa-artifacts      : リポジトリに qa-output/ がある場合、各セッションを検証する。
#                         (このスキルセット単体のリポジトリには通常存在しない。
#                          利用側プロジェクトへコピーして使うことを想定)
#
# 実装メモ: Windows ランナーでも同じ bash スクリプトが動くよう、
# ワークスペース直下の相対パスだけを使い `cd` しない($RUNNER_TEMP は
# Windows では `D:\a\_temp` 形式になり bash のエスケープと衝突するため)。

name: QA成果物の検証

on:
  pull_request:
    paths:
      - '.github/skills/_shared/scripts/**'
      - '.github/hooks/**'
      - '.github/workflows/qa-artifacts.yml'
      - '.claude/settings.json'
      - '.vscode/settings.json'
      - 'qa-output/**'
  push:
    branches: [main]
    paths:
      - '.github/skills/_shared/scripts/**'
      - '.github/hooks/**'
      - '.github/workflows/qa-artifacts.yml'
      - '.claude/settings.json'
      - '.vscode/settings.json'
      - 'qa-output/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  SCRIPTS: .github/skills/_shared/scripts
  FX: _ci-fixture

jobs:
  verifier-selftest:
    name: 検証層の自己検査 (${{ matrix.os }} / Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # scripts/README.md が宣言する下限バージョン
          - { os: ubuntu-latest, python: '3.9' }
          - { os: ubuntu-latest, python: '3.13' }
          # 「Windows / macOS / Linux 対応」の宣言を実際に確かめる
          - { os: windows-latest, python: '3.13' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 構文チェック(標準ライブラリのみで動くこと)
        run: python -m compileall -q "$SCRIPTS"

      - name: 各スクリプトが起動できること
        run: |
          set -e
          for s in qa_session.py defect_stats.py pairwise.py trace_check.py \
                   lint_output.py metrics.py gate_check.py hook_entry.py \
                   miniyaml.py validate_artifact.py render_md.py; do
            echo "--- $s"
            python "$SCRIPTS/$s" --help > /dev/null
          done

      - name: hook 配線がずれていないこと
        run: |
          set -e
          # hook 設定は形式が違うため Copilot 用と Claude Code 用の2つある。
          # ずれると片方の環境でだけゲートが静かに効かなくなる(hooks.md §3)
          python .github/hooks/check_hooks_config.py

      - name: PyYAML を入れる(差分テスト専用。実行時の依存ではない)
        run: python -m pip install --quiet pyyaml

      - name: miniyaml が本物のYAMLの厳密なサブセットであること
        run: |
          set -e
          # miniyaml は自前実装なので、受理したものが本物のYAMLでも同じ意味で
          # 読めることを毎回確かめる。ここが崩れると成果物が他ツールで読めなくなる
          python - "$SCRIPTS" <<'PY'
          import json, sys
          sys.path.insert(0, sys.argv[1])
          import miniyaml, yaml

          def norm(v):
              if isinstance(v, dict): return {k: norm(x) for k, x in v.items()}
              if isinstance(v, list): return [norm(x) for x in v]
              if v is None: return ""
              if isinstance(v, bool): return "yes" if v else "no"
              return str(v)

          ACCEPT = [
              "target: x\nrun_mode: process\n",
              "meta:\n  target: 請求書\n  run_mode: process\n",
              "v:\n  - id: VP-01\n    x: 必須項目未入力\n  - id: VP-02\n    x: 権限なし\n",
              "a:\n  - id: X\n    t: [SC-01, SC-02]\n    s: []\n",
              "tags:\n  - alpha\n  - beta\n",
              "n:\n  e: |\n    行1\n    行2\n  c: |-\n    行3\n",
              "n: >\n  aaa\n  bbb\n\n  ccc\n",
              "a: \"コロン: を含む\"   # コメント\nb: 'q''s'\nc: plain\n",
              "s:\n  f:\n    - name: id\n      type: string\n    - name: src\n      type: list\n",
              "- id: B-1\n  l: A\n- id: B-2\n  l: B\n",
              "---\na:\nb: x\n",
              "a: |\n  行1\n    深い行\n  行2\n",
          ]
          bad = 0
          for t in ACCEPT:
              mine = miniyaml.parse(t)
              theirs = norm(yaml.safe_load(t))
              if mine != theirs:
                  bad += 1
                  print("::error::miniyaml と PyYAML が不一致")
                  print("  入力  :", json.dumps(t, ensure_ascii=False))
                  print("  mine  :", json.dumps(mine, ensure_ascii=False))
                  print("  pyyaml:", json.dumps(theirs, ensure_ascii=False))

          # 本物のYAMLでも誤りになる書き方は受理してはならない
          MUST_REJECT = [
              "a: 値: 補足\n",          # プレーンスカラー中の `: `
              "a: 値:\n",               # 末尾コロン
              "a: 1\n---\nb: 2\n",      # 複数ドキュメント
              "a:\n\tb: 1\n",           # タブインデント
              'a: "x\n',                # 引用符未閉じ
              "a: [x, y\n",             # インラインseq未閉じ
              "a: 1\na: 2\n",           # キー重複
          ]
          for t in MUST_REJECT:
              try:
                  miniyaml.parse(t)
              except miniyaml.YamlError:
                  continue
              bad += 1
              print("::error::miniyaml が受理してはならない入力を受理しました: %r" % t)

          # 差分テストのスキャフォールド自体が壊れていないことの確認
          for t in ACCEPT:
              yaml.safe_load(t)

          print("OK: 受理 %d 件 / 拒否 %d 件" % (len(ACCEPT), len(MUST_REJECT)))
          sys.exit(1 if bad else 0)
          PY

      - name: 同梱スキーマが miniyaml と PyYAML の両方で同じに読めること
        run: |
          set -e
          python - "$SCRIPTS" .github/skills/_shared/schemas <<'PY'
          import sys, pathlib
          sys.path.insert(0, sys.argv[1])
          import miniyaml, yaml
          def norm(v):
              if isinstance(v, dict): return {k: norm(x) for k, x in v.items()}
              if isinstance(v, list): return [norm(x) for x in v]
              if v is None: return ""
              if isinstance(v, bool): return "yes" if v else "no"
              return str(v)
          bad = 0
          files = sorted(pathlib.Path(sys.argv[2]).glob("*.yaml"))
          if not files:
              print("::error::スキーマが1つもありません"); sys.exit(1)
          for p in files:
              text = p.read_text(encoding="utf-8")
              if miniyaml.parse(text) != norm(yaml.safe_load(text)):
                  print("::error::スキーマの解釈が不一致: %s" % p.name); bad += 1
              else:
                  print("OK: %s" % p.name)
          sys.exit(1 if bad else 0)
          PY

      - name: defect_stats が miniyaml 移行後も同じ結果を出すこと
        run: |
          set -e
          mkdir -p "$FX"
          printf 'id,title,description\nBUG-1,"合計: 不一致",請求合計が誤る\nBUG-2,権限漏れ,承認できる\n' > "$FX/bugs.csv"
          python "$SCRIPTS/defect_stats.py" normalize "$FX/bugs.csv" -o "$FX/labeled.yaml" > /dev/null
          # コロンを含むタイトルが引用され、読み戻せること(miniyaml との往復)
          grep -q 'title: "合計: 不一致"' "$FX/labeled.yaml" \
            || { echo '::error::コロンを含むタイトルが引用されていません'; exit 1; }
          python "$SCRIPTS/defect_stats.py" stats "$FX/labeled.yaml" > /dev/null
          echo "OK: CSV→YAML雛形→読み戻しが通ります"

      - name: フィクスチャ作成(検出されるべき欠陥を仕込む)
        run: |
          set -e
          mkdir -p "$FX"
          python "$SCRIPTS/qa_session.py" init "$FX/qa-output/ci" --name ci \
            --feature "CI自己検査" --run-mode process
          python "$SCRIPTS/qa_session.py" add-phase "$FX/qa-output/ci" \
            --steps qa-test-viewpoint:G4 --steps qa-test-case-design:G4

          cat > "$FX/qa-output/ci/30-test-viewpoint.md" <<'EOF'
          # テスト観点一覧: CI自己検査

          > 実行モード: process

          ## 1. 土台の分解表

          | 機能 | 入力条件 | 状態 | 出力 |
          |---|---|---|---|
          | 申請 | 必須項目充足 | 下書き | 申請中 |

          ## 2. テスト観点一覧

          | ID | 対象(SC/機能) | 観点 | 期待結果の要点 | 導出元(技法/特性/BUG-ID/QC-ID/仕様節) | traces_to | 優先度 |
          |---|---|---|---|---|---|---|
          | VP-01 | 申請 | 必須項目未入力で申請できないこと | 申請ボタンが無効。DBの状態が変わらない | 同値分割 | - | High |

          ## 3. 対象外とした観点とその理由

          該当なし

          ## 4. 期待結果が定義できなかった観点

          該当なし

          ## 5. カバレッジ確認結果

          該当なし
          EOF

          cat > "$FX/qa-output/ci/31-test-case.md" <<'EOF'
          # テストケース: CI自己検査

          ## 1. 展開サマリー

          該当なし

          ## 2. テストケース一覧

          | ID | 観点ID | 前提条件 | 手順 | 期待結果 |
          |---|---|---|---|---|
          | TC-01 | VP-01 | 下書きがある | 空で申請 | 申請ボタンが無効。status が draft のまま |
          | TC-02 | VP-99 | 下書きがある | 空で申請 | エラーになる |

          ## 3. 実行順序・依存関係の注意

          該当なし

          ## 4. 未展開の観点とその理由

          該当なし
          EOF

      - name: 仕込んだ欠陥を検出できること(誤って PASS を返さないこと)
        run: |
          set -e
          # TC-02 が実在しない観点 VP-99 を参照している(trace_check チェック1)
          if python "$SCRIPTS/gate_check.py" "$FX/qa-output/ci" --gate G4; then
            echo "::error::gate_check が仕込んだ欠陥(VP-99 への孤児参照)を見逃しました。検証層が機能していません。"
            exit 1
          fi
          echo "OK: 仕込んだ欠陥を検出しました"

      - name: 規約どおりのヘッダが誤検出されないこと
        run: |
          set -e
          # `導出元(…/QC-ID/…)` は qa-test-viewpoint の出力フォーマットが定める
          # 正しいヘッダ。これが ERROR になると全観点一覧がブロックされる
          errs=$(python "$SCRIPTS/gate_check.py" --files "$FX/qa-output/ci/30-test-viewpoint.md" --json \
                 | python -c "import json,sys; print(json.load(sys.stdin)['lint']['errors'])")
          if [ "$errs" != "0" ]; then
            echo "::error::規約どおりに書いた成果物が lint ERROR になりました(誤検出 $errs 件)。"
            python "$SCRIPTS/gate_check.py" --files "$FX/qa-output/ci/30-test-viewpoint.md"
            exit 1
          fi
          echo "OK: 規約どおりのヘッダは誤検出されません"

      - name: 解消したら通ること
        run: |
          set -e
          python - "$FX/qa-output/ci/31-test-case.md" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          p.write_text(p.read_text(encoding="utf-8").replace("VP-99", "VP-01"),
                       encoding="utf-8")
          PY
          python "$SCRIPTS/gate_check.py" "$FX/qa-output/ci" --gate G4
          echo "OK: 解消後は PASS します"

      - name: Quick モードには網羅の手続きを課さないこと
        run: |
          set -e
          mkdir -p "$FX/qa-output/quick"
          cp "$FX/qa-output/ci/30-test-viewpoint.md" "$FX/qa-output/quick/"
          python "$SCRIPTS/qa_session.py" init "$FX/qa-output/quick" --name quick \
            --feature q --run-mode quick
          out=$(python "$SCRIPTS/gate_check.py" "$FX/qa-output/quick")
          echo "$out"
          echo "$out" | grep -q "run_mode=quick" \
            || { echo "::error::Quick モードで trace_check がスキップされていません(skill-map.md §2 違反)"; exit 1; }
          echo "OK: skill-map.md §2 を尊重しています"

      - name: hook アダプタが方言差を吸収し fail-open すること
        run: |
          set -e
          cmd="python qa_session.py set-gate qa-output/ci G4 approved"
          python - "$FX" "$cmd" <<'PY' > "$FX/payload_claude.json"
          import json, sys
          print(json.dumps({"cwd": sys.argv[1], "session_id": "ci",
                            "tool_name": "Bash",
                            "tool_input": {"command": sys.argv[2]}}))
          PY
          python - "$FX" "$cmd" <<'PY' > "$FX/payload_copilot.json"
          import json, sys
          print(json.dumps({"cwd": sys.argv[1], "session_id": "ci",
                            "toolName": "bash",
                            "toolArgs": {"command": sys.argv[2]}}))
          PY
          # 直前のステップで欠陥は解消済み。どちらの方言でも通過するはず
          for f in payload_claude.json payload_copilot.json; do
            python "$SCRIPTS/hook_entry.py" pre-bash < "$FX/$f" > /dev/null \
              || { echo "::error::$f: 解消済みなのにブロックされました"; exit 1; }
          done
          # 壊れた入力でもワークフローを止めないこと(fail-open)
          echo '{broken' | python "$SCRIPTS/hook_entry.py" pre-bash > /dev/null 2>&1 \
            || { echo "::error::壊れたペイロードで異常終了しました(fail-open でない)"; exit 1; }
          echo "OK: 方言吸収と fail-open を確認しました"

      - name: 欠陥を戻すと hook がブロックすること
        run: |
          set -e
          python - "$FX/qa-output/ci/31-test-case.md" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          p.write_text(p.read_text(encoding="utf-8").replace("| TC-02 | VP-01 |", "| TC-02 | VP-99 |"),
                       encoding="utf-8")
          PY
          if python "$SCRIPTS/hook_entry.py" pre-bash < "$FX/payload_claude.json" > /dev/null 2>&1; then
            echo "::error::ゲート承認ガードが欠陥を素通ししました。"
            exit 1
          fi
          echo "OK: ゲート承認ガードがブロックしました"

      - name: 構造化成果物のフィクスチャを作る
        run: |
          set -e
          mkdir -p "$FX/qa-output/yml"
          python "$SCRIPTS/qa_session.py" init "$FX/qa-output/yml" --name yml \
            --feature "構造化の自己検査" --run-mode process
          python "$SCRIPTS/qa_session.py" add-phase "$FX/qa-output/yml" \
            --steps qa-test-viewpoint:G4
          cat > "$FX/qa-output/yml/30-test-viewpoint.yaml" <<'EOF'
          meta:
            target: 請求書の申請・承認
            run_mode: process
          viewpoints:
            - id: VP-01
              subject: SC-01
              viewpoint: 必須項目未入力で申請できないこと
              expected: 申請ボタンが無効。invoices.status が draft のまま
              derived_from: [同値分割]
              traces_to: [SC-01]
              priority: High
              oracle: db
              evidence_level: confirmed
              sources: [basic-design.md#3.2]
            - id: VP-02
              subject: 承認
              viewpoint: 承認者の権限が剥奪された後の取消
              expected: 取消は不可。監査ログに拒否が1件記録される
              derived_from: [リスク分析]
              priority: Medium
              oracle: db
              evidence_level: hypothesis
              derivation: proposed
          narrative:
            breakdown: |
              該当なし
            excluded: |
              該当なし
            undefined_expected: |
              該当なし
            coverage: |
              該当なし
          EOF

      - name: proposed が機械的に別表へ分けられること
        run: |
          set -e
          # conventions.md §5-3 はこのスキルセットで最も重い違反。散文の指示ではなく
          # レンダラの構造として保証されていることを確かめる
          python "$SCRIPTS/render_md.py" "$FX/qa-output/yml/30-test-viewpoint.yaml"
          md="$FX/qa-output/yml/30-test-viewpoint.md"
          grep -q "要件外提案" "$md" \
            || { echo '::error::proposed の項目が別表に分けられていません(conventions.md §5-3)'; exit 1; }
          # VP-02(proposed)が「要件外提案」見出しより後にあること
          main_end=$(grep -n "要件外提案" "$md" | head -1 | cut -d: -f1)
          vp02=$(grep -n "| VP-02 |" "$md" | head -1 | cut -d: -f1)
          [ "$vp02" -gt "$main_end" ] \
            || { echo '::error::proposed の行が本表に混ざっています'; exit 1; }
          # 生成された Markdown は lint を通ること(生成物が規約違反では意味がない)
          python "$SCRIPTS/lint_output.py" "$md"
          echo "OK: proposed は構造として隔離されています"

      - name: スキーマ検証が規約違反を捕まえること
        run: |
          set -e
          y="$FX/qa-output/yml/30-test-viewpoint.yaml"
          cp "$y" "$FX/keep.yaml"
          # explicit(既定)なのに出典がない = 根拠なし事実主張(conventions.md §5-3)
          python - "$y" <<'PY'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          text, n = re.subn(r"^[ \t]*sources: \[basic-design[^\]]*\]\n", "",
                            p.read_text(encoding="utf-8"), flags=re.M)
          if n != 1:
              print("::error::フィクスチャの sources 行を削除できませんでした"); sys.exit(1)
          p.write_text(text, encoding="utf-8")
          PY
          if python "$SCRIPTS/validate_artifact.py" "$y" > /dev/null; then
            echo "::error::出典のない explicit 項目を見逃しました(conventions.md §5-3)"
            exit 1
          fi
          python "$SCRIPTS/validate_artifact.py" "$y" | grep -q explicit_requires_sources \
            || { echo '::error::期待したルールが発火していません'; exit 1; }
          cp "$FX/keep.yaml" "$y"
          python "$SCRIPTS/validate_artifact.py" "$y" > /dev/null
          echo "OK: スキーマ検証が規約違反を捕まえます"

      - name: Markdown を直接編集したら検出されること
        run: |
          set -e
          md="$FX/qa-output/yml/30-test-viewpoint.md"
          python "$SCRIPTS/render_md.py" "$FX/qa-output/yml/30-test-viewpoint.yaml" > /dev/null
          python - "$md" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          p.write_text(p.read_text(encoding="utf-8").replace("| High |", "| Low |", 1),
                       encoding="utf-8", newline="\n")
          PY
          if python "$SCRIPTS/gate_check.py" "$FX/qa-output/yml" > /dev/null; then
            echo "::error::Markdown の直接編集(YAMLとのずれ)を見逃しました"
            exit 1
          fi
          python "$SCRIPTS/render_md.py" "$FX/qa-output/yml/30-test-viewpoint.yaml" > /dev/null
          python "$SCRIPTS/gate_check.py" "$FX/qa-output/yml" > /dev/null
          echo "OK: 再生成すれば通ります"

  qa-artifacts:
    name: QA成果物のゲート検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: セッションごとに gate_check を実行
        run: |
          set -e
          if [ ! -d qa-output ]; then
            echo "qa-output/ がないためスキップします(このリポジトリでは通常の状態)"
            exit 0
          fi
          status=0
          found=0
          for d in qa-output/*/; do
            [ -d "$d" ] || continue
            found=1
            echo "::group::$d"
            python "$SCRIPTS/gate_check.py" "$d" || status=1
            echo "::endgroup::"
          done
          [ "$found" = "1" ] || echo "検証対象のセッションがありません"
          exit $status
