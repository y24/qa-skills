# 仕様レビュー(40-spec-review[-対象])のスキーマ
#
# 出力フォーマットの定義元は qa-spec-review/SKILL.md。AMB-ID は
# conventions.md §6-1。観点・ケースからの AMB 参照はここの定義を指す。

artifact: spec-review
number: "40"
title: 仕様レビュー

ledgers:
  - key: categories
    optional: yes
    fields:
      - name: num
        label: "#"
        required: yes
      - name: category
        label: カテゴリ
        required: yes
      - name: count
        label: 検出数
        required: yes
      # 検出0件でも「走査した」証跡を残す。空欄を許さない
      - name: note
        label: "備考(検出0件時: 主な確認箇所)"
        required: yes

  - key: findings
    id_prefix: AMB
    detail_title: title
    fields:
      - name: id
        label: ID
        required: yes
        pattern: "^AMB-\\d+$"
      - name: title
        label: 検出
        required: yes
        detail: no
      - name: severity
        label: 深刻度
        required: yes
        enum: [Blocker, High, Medium, Low]
      - name: category
        label: カテゴリ
        required: yes
      - name: location
        label: 該当箇所
        required: yes
      - name: why
        label: なぜ曖昧か
        required: yes
      - name: question
        label: 確認質問
        required: yes
      - name: options
        label: 候補となる答え
        type: list
        required: yes
      - name: impact
        label: これが決まらないと何が作れないか
        required: yes
      - name: evidence_level
        label: evidence_level
        enum: [confirmed, likely, hypothesis]
      - name: sources
        label: 出典
        type: list
      - name: derivation
        enum: [explicit, inferred, proposed]
        default: explicit
        render: no

  - key: judgements
    optional: yes
    fields:
      - name: id
        label: ID
        required: yes
      - name: decision
        label: 判定
        required: yes
      - name: note
        label: 備考

rules:
  - unique_ids
  - id_pattern
  - required_fields
  - enum_values
  - explicit_requires_sources

sections:
  - num: 1
    title: サマリー
    from: narrative.summary
  - num: 2
    title: カテゴリ別走査結果
    from: ledger.categories
  - num: 3
    title: 検出一覧
    from: detail.findings
  - num: 4
    title: ユーザー判定結果
    from: ledger.judgements
  - num: 5
    title: 用語集への追記候補
    from: narrative.glossary
